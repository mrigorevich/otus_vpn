---
- name: VPN-srv
  hosts: server
  become: true
  vars:
    openvpn_dir: /etc/openvpn
    easyrsa_bin: /usr/share/easy-rsa/easyrsa
  tasks:

    - name: install packages
      apt:
        name:
            - easy-rsa
        state: present
        update_cache: false
    
    - name: PKI
      command:
        cmd: "{{ easyrsa_bin }} --batch init-pki"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki"
    - name: CA
      command:
        cmd: "{{ easyrsa_bin }} --batch build-ca nopass"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/ca.crt"
      environment:
        EASYRSA_REQ_CN: "OpenVPN-CA"
    - name: keygen
      command:
        cmd: "{{ easyrsa_bin }} --batch gen-req server nopass"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/private/server.key"
      environment:
        EASYRSA_REQ_CN: "rasvpn"
    - name: sign srv_key
      command:
        cmd: "{{ easyrsa_bin }} --batch sign-req server server"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/issued/server.crt"
    - name: DH
      command:
        cmd: "{{ easyrsa_bin }} --batch gen-dh"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/dh.pem"
    - name: CA.key
      command:
        cmd: openvpn --genkey secret {{ openvpn_dir }}/pki/ca.key
        creates: "{{ openvpn_dir }}/pki/ca.key"
    - name: client key
      command:
        cmd: "{{ easyrsa_bin }} --batch gen-req client nopass"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/private/client.key"
      environment:
        EASYRSA_REQ_CN: "client"
    - name: sign client cert
      command:
        cmd: "{{ easyrsa_bin }} --batch sign-req client client"
        chdir: "{{ openvpn_dir }}"
        creates: "{{ openvpn_dir }}/pki/issued/client.crt"
    
    - name: client config
      file:
        path: "{{ openvpn_dir }}/client"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: client route
      copy:
        dest: "{{ openvpn_dir }}/client/client"
        content: "iroute 10.10.10.0 255.255.255.0\n"
        owner: root
        group: root
        mode: '0644'
    
    - name: server config
      copy:
        dest: "{{ openvpn_dir }}/server/server.conf"
        owner: root
        group: root
        mode: '0600'
        content: |
          port 1207
          proto udp
          dev tun
          ca /etc/openvpn/pki/ca.crt
          cert /etc/openvpn/pki/issued/server.crt
          key /etc/openvpn/pki/private/server.key
          dh /etc/openvpn/pki/dh.pem
          server 10.10.10.0 255.255.255.0
          ifconfig-pool-persist ipp.txt
          client-to-client
          client-config-dir /etc/openvpn/client
          keepalive 10 120
          comp-lzo
          persist-key
          persist-tun
          status /var/log/openvpn-status.log
          log /var/log/openvpn.log
          verb 3
      notify: restart openvpn
    - name: copy key
      fetch:
        src: "{{ item }}"
        dest: /home/vagrant/shared/
        flat: true
      loop: 
        - "{{ openvpn_dir }}/pki/ca.crt"
        - "{{ openvpn_dir }}/pki/ca.key"
        - "{{ openvpn_dir }}/pki/issued/client.crt"
        - "{{ openvpn_dir }}/pki/private/client.key"
        
    - name: server-unit
      copy:
        dest: /etc/systemd/system/openvpn@.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=OpenVPN Tunneling Application On %I
          After=network.target
          
          [Service]
          Type=notify
          PrivateTmp=true
          ExecStart=/usr/sbin/openvpn --cd /etc/openvpn/server/ --config %i.conf
          
          [Install]
          WantedBy=multi-user.target
      notify: reload systemd
    - name: reload systemd
      meta: flush_handlers
    - name: enable and start openvpn@server
      systemd_service:
        name: openvpn@server
        state: started
        enabled: yes
        
  handlers:
    - name: restart openvpn
      service:
        name: openvpn@server
        state: restarted
        enabled: true
    - name: reload systemd
      systemd_service:
        daemon_reload: yes

